<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agendly · La tua giornata, sotto controllo</title>
    <meta name="description" content="Agendly è l’agenda personale per organizzare impegni, attività, scadenze e promemoria, con notifiche urgenti. Veloce, semplice e funziona anche offline." />
    <meta name="keywords" content="agenda, promemoria, attività, calendario, notifiche, to-do, PWA" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Agendly" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agendly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agendly" />
    <meta property="og:description" content="La tua giornata, sotto controllo." />
    <meta property="og:image" content="/logo/agendly-splash.png" />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/logo/agendly-mono-black.svg" color="#2563EB" />
    <script>
      try {
        var t = localStorage.getItem('agendly.theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Agendly richiede JavaScript per funzionare.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
